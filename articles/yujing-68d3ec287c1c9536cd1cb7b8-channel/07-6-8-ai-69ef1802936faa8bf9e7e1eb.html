                margin-top: 1.9em;
                margin-bottom: 0.75em;
                letter-spacing: -0.02em;

            .article-body p {

            }

            .article-body .openget-meta {

                gap: 12px;
                margin-bottom: 28px;
                padding: 18px 20px;
                border: 1px solid rgba(36, 31, 26, 0.08);
                border-radius: 18px;
                background: rgba(36, 31, 26, 0.035);
            }

            .article-body .openget-meta-item {
                display: grid;
                gap: 4px;
            }

            .article-body .openget-meta-label {
                color: var(--muted);
                font-size: 0.76rem;

                letter-spacing: 0.12em;
                text-transform: uppercase;

            .article-body a {

                text-decoration-thickness: 0.08em;
                text-underline-offset: 0.14em;
            }

            .article-body blockquote {
                margin: 1.5em 0;
